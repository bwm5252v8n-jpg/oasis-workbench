<style>
/* ==================== 基础重置与变量 ==================== */
:root {
  --green-50: #f0fbf4;
  --green-100: #dcf5e6;
  --green-200: #bbe8cd;
  --green-300: #86d3a4;
  --green-400: #4ebd78;
  --green-500: #2ecc71;
  --green-600: #27ae60;
  --green-700: #1e8449;
  --green-800: #196f3d;
  --green-900: #145a32;
  --bg: #f5f9f7;
  --card-bg: #ffffff;
  --text: #1a2e23;
  --text-light: #5a7065;
  --text-muted: #8ea59b;
  --border: #e0ebe5;
  --shadow: 0 2px 8px rgba(30, 132, 73, 0.08);
  --shadow-lg: 0 4px 20px rgba(30, 132, 73, 0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 240px;
  --sidebar-w-collapsed: 64px;
  --danger: #e74c3c;
  --warning: #f39c12;
  --info: #3498db;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; }
ul { list-style: none; }
a { color: var(--green-600); text-decoration: none; }
/* ==================== 滚动条 ==================== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--green-200); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--green-300); }
/* ==================== 布局 ==================== */
.app { display: flex; height: 100vh; height: 100dvh; }
/* ==================== 侧边栏 ==================== */
.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, var(--green-700) 0%, var(--green-800) 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  transition: width 0.3s ease;
  flex-shrink: 0;
  z-index: 100;
  position: relative;
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sidebar-header {
  padding: 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 64px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-logo {
  width: 32px; height: 32px;
  background: var(--green-400);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.sidebar-title {
  font-size: 16px; font-weight: 700;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.sidebar.collapsed .sidebar-title,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-section-title,
.sidebar.collapsed .sidebar-footer-text { opacity: 0; pointer-events: none; }
.sidebar-toggle {
  position: absolute;
  top: 16px; right: -12px;
  width: 24px; height: 24px;
  background: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
  color: var(--green-700);
  font-size: 12px;
  z-index: 101;
  transition: transform 0.3s;
}
.sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
.nav-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 20px 6px;
  color: rgba(255,255,255,0.4);
  white-space: nowrap;
  transition: opacity 0.2s;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-item.active { background: rgba(255,255,0.15); color: #fff; }
.nav-item.active::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--green-300);
}
.nav-icon { font-size: 18px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-label { transition: opacity 0.2s; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
  min-height: 48px;
  display: flex; align-items: center; gap: 8px;
}
.sidebar-footer-text { font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; transition: opacity 0.2s; }
/* ==================== 主内容区 ==================== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  height: 56px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
}
.topbar-title { font-size: 18px; font-weight: 700; color: var(--text); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
/* ==================== 通用组件 ==================== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.card-title .icon { font-size: 18px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary { background: var(--green-500); color: #fff; }
.btn-primary:hover { background: var(--green-600); }
.btn-primary:active { transform: scale(0.97); }
.btn-outline { border: 1px solid var(--green-300); color: var(--green-700); }
.btn-outline:hover { background: var(--green-50); }
.btn-ghost { color: var(--text-light); }
.btn-ghost:hover { background: var(--green-50); color: var(--green-700); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: #fdf0ef; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 16px;
}
.input, .textarea, .select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--text);
  transition: border-color 0.2s;
  outline: none;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--green-400); }
.textarea { resize: vertical; min-height: 80px; }
.field-group { margin-bottom: 12px; }
.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-green { background: var(--green-100); color: var(--green-700); }
.badge-orange { background: #fef3e2; color: #d68910; }
.badge-blue { background: #ebf5fb; color: #2471a3; }
.badge-red { background: #fdf0ef; color: var(--danger); }
.badge-gray { background: #f0f3f1; color: var(--text-muted); }
/* 统计数字 */
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-icon { font-size: 24px; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--text); }
.stat-label { font-size: 12px; color: var(--text-muted); }
.stat-trend { font-size: 11px; }
/* 进度条 */
.progress-bar {
  height: 6px;
  background: var(--green-50);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green-400), var(--green-600));
  border-radius: 3px;
  transition: width 0.5s ease;
}
/* 复选框 */
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  transition: background 0.2s;
}
.todo-item:hover { background: var(--green-50); }
.todo-check {
  width: 20px; height: 20px;
  border: 2px solid var(--green-300);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 1px;
}
.todo-check.checked { background: var(--green-500); border-color: var(--green-500); }
.todo-check.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: bold; }
